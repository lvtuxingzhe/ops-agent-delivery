[tool.pytest.ini_options]
# 只跑 tests/；阶段验收脚本（backend/scripts/selftest_*.py）要真库，
# 单独跑，不混进单元测试。
testpaths = ["tests"]
pythonpath = ["backend", "packages", "worker", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    ".venv",
    "desktop",
    "frontend",
    "runtime-data",
    "samples",
    "var",
]

[tool.ruff.lint]
# E/W 是风格，F 是明显错误，I 是 import 顺序，B 是常见陷阱，
# UP 是过时写法。先收敛到这几类，避免一上来就几百条历史告警。
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # 行宽交给 format，注释里常有长句
    "B008",  # FastAPI 的 Depends() 默认参数是框架约定，不是陷阱
]

[tool.ruff.lint.per-file-ignores]
# 自检脚本天然要先 sys.path.insert 再 import
"backend/scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# 这两个文件里「先 import shared_packages 设 sys.path，再 import ops_*」
# 的顺序是功能依赖，不能被 isort 重排，整文件豁免 I001
"backend/app/core/redaction.py" = ["I001"]
"backend/app/core/report_validator.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
# 先把「新增模块」管住；存量模块逐步纳入，避免一次性几千条噪声。
files = [
    "backend/app/core/web.py",
    "backend/app/core/db.py",
    "backend/app/services/task_queue.py",
    "backend/app/services/audit_archive.py",
    "backend/app/core/ratelimit.py",
    "worker/tools/exec_core.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [".venv"]
